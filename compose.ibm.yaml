# Production stack for the IBM Cloud VSI. Data lives on the separate block volume mounted at /srv/geo-data,
# NOT in a Docker volume on the boot disk.
services:
  app:
    build: .
    env_file: .env
    environment:
      GEO_AUTH_MODE: basic
      GEO_BIND: 0.0.0.0
      GEO_DATA_DIR: /app/data
      PORT: 8080
    expose:
      - "8080"
    volumes:
      - /srv/geo-data/app:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  proxy:
    image: caddy:2
    environment:
      GEO_PUBLIC_HOST: ${GEO_PUBLIC_HOST:?Set GEO_PUBLIC_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/geo-data/caddy:/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
