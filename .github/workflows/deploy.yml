name: Deploy
# Push a tag like v0.1.0 -> CI checks -> build the image here -> stream it to the VM -> health check -> auto-rollback if unhealthy.
# The VM has 1 GB of RAM, so it never builds anything. Run it by hand from the Actions tab to redeploy any tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  production:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          echo "TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          docker build -t "geo-workbench:${GITHUB_SHA::12}" .
      - name: Deploy to the VM
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          TARGET: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          OPTS="-i key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30"
          scp $OPTS deploy/compose.yaml "$TARGET:/tmp/geo-compose.yaml"
          scp $OPTS deploy/deploy.sh "$TARGET:/tmp/geo-deploy.sh"
          docker save "geo-workbench:$TAG" | gzip -1 | ssh $OPTS "$TARGET" "bash /tmp/geo-deploy.sh '$TAG'"
          rm -f key
      - name: Smoke test
        env:
          URL: ${{ vars.PROD_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$URL/healthz" | grep -q '"ok"'; then echo "healthy: $URL"; exit 0; fi
            sleep 5
          done
          echo "smoke test failed for $URL" >&2; exit 1
