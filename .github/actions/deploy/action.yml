name: Deploy to VM
description: Copy deploy.sh to the VM, run it for one environment, then smoke-test the public URL.
inputs:
  env-name: { description: staging or prod, required: true }
  url: { description: Public URL of the environment, required: true }
  host: { description: VM address, required: true }
  user: { description: VM user, required: true }
  ssh-key: { description: Private key for the VM, required: true }
runs:
  using: composite
  steps:
    - name: Deploy over SSH
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        TARGET: ${{ inputs.user }}@${{ inputs.host }}
        ENV_NAME: ${{ inputs.env-name }}
      run: |
        install -m 600 /dev/null key
        printf '%s\n' "$SSH_KEY" > key
        OPTS="-i key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30"
        scp $OPTS deploy/deploy.sh "$TARGET:/tmp/geo-deploy.sh"
        ssh $OPTS "$TARGET" "bash /tmp/geo-deploy.sh '$ENV_NAME' '${GITHUB_SHA}'"
        rm -f key
    - name: Smoke test
      shell: bash
      env:
        URL: ${{ inputs.url }}
      run: |
        for i in $(seq 1 12); do
          if curl -fsS "$URL/healthz" | grep -q '"ok"'; then echo "healthy: $URL"; exit 0; fi
          sleep 5
        done
        echo "smoke test failed for $URL" >&2; exit 1
